<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="weather-app">

        <h1>🌦️ Weather App</h1>

        <div class="search-box">

            <input
                type="text"
                id="city"
                placeholder="Search city or place"
                autocomplete="off"
                oninput="searchPlaces()"
            >

            <button onclick="getWeather()">
                Search
            </button>
            <button onclick="getMyLocation()">
    📍 Use My Location
            </button>

        </div>


        <!-- Search Suggestions -->

        <div id="suggestions"></div>


        <!-- Current Weather -->

        <div class="weather-info">

            <h2 id="city-name">City</h2>

            <h3 id="temperature">-- °C</h3>

            <p id="condition">
                Weather condition
            </p>

            <p id="feels-like">
                Feels Like: -- °C
            </p>

            <p id="humidity">
                Humidity: --
            </p>

            <p id="wind">
                Wind: --
            </p>

        </div>


        <!-- 7 Day Forecast -->

        <h2 class="forecast-title">
            📅 7 Day Forecast
        </h2>

        <div id="forecast"></div>

    </div>


    <script src="script.js"></script>

</body>

</html>
